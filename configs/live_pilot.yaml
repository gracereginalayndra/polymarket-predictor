project: HX2605
seed: 2605
data_dir: data/live_pilot
artifact_dir: artifacts/live_pilot
database: data/live_pilot/pilot.sqlite
mode: prospective
market_filters: configs/market_filters.yaml
http:
  timeout_seconds: 8
  retries: 0
  min_interval_seconds: 0.25
  user_agent: HX2605-academic-research/0.1
polymarket:
  gamma_base: https://gamma-api.polymarket.com
  clob_base: https://clob.polymarket.com
  data_base: https://data-api.polymarket.com/v2
  history_backend: v2
  max_markets: 4
  page_size: 40
  max_pages: 5
  history_days: 7
news:
  rss_urls:
  - https://feeds.bbci.co.uk/news/world/rss.xml
  - https://www.federalreserve.gov/feeds/press_all.xml
  gdelt_queries:
  - inflation
social:
  subreddits: []
dataset:
  horizons_hours:
  - 24
  - 168
  max_price_age_seconds: 21600
  lookback_days: 30
  start: null
  end: null
retrieval:
  top_k: 8
  min_score: 0.01
  max_per_domain: 2
  max_chars: 1800
  include_social: true
llm:
  provider: chat_completions
  model: null
  model_frozen_before: null
  temperature: 0
  max_output_tokens: 600
  max_calls_per_run: 100
  timeout_seconds: 60
  allow_retrospective: false
  prompt_dir: configs/prompts
  k: 3
training:
  train_end: null
  validation_end: null
  min_train_groups: 30
  min_validation_groups: 10
  regularization_grid:
  - 0.1
  - 1.0
  - 10.0
  bayesian_prior_sd: 1.0
evaluation:
  bootstrap_samples: 2000
  calibration_bins: 5
  log_loss_epsilon: 1.0e-06
  primary_system: hybrid_verified
